plugins {
    id 'com.gradleup.shadow'
}

repositories {
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }

    maven {
        name = "zelythiaMaven"
        url = uri("https://maven.zelythia.net/releases")
    }

    maven {
        name = "zelythiaMavenSnapshots"
        url = uri("https://maven.zelythia.net/snapshots")
    }

    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

loom {
    forge {
        mixinConfig "tool_trinkets.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    // Compile against only the API artifact
//    modCompileOnly "top.theillusivec4.curios:curios-forge:${rootProject.curios_version}:api"
    modCompileOnly "top.theillusivec4.curios:curios-forge:${rootProject.curios_version}"
    // Use the full Curios API jar at runtime
    modRuntimeOnly "top.theillusivec4.curios:curios-forge:${rootProject.curios_version}"

    modImplementation("net.zelythia:autotools-forge:3.3.4-SNAPSHOT+1.20.1")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
