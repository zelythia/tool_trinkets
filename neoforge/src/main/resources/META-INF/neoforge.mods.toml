side = "CLIENT"

[[dependencies.tool_trinkets]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.5,1.21)"
ordering = "NONE"
side = "BOTH"

[[dependencies.tool_trinkets]]
modId = "curios"
mandatory = true
versionRange = "*"
ordering = "NONE"
side = "BOTH"

[[dependencies.tool_trinkets]]
modId = "autotools"
mandatory = false
versionRange = "[3.3.2,)"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "tool_trinkets.mixins.json"
