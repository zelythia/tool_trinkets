plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }

    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }

    maven {
        name = "zelythiaMaven"
        url = uri("https://maven.zelythia.net/releases")
    }

    maven {
        name = "zelythiaMavenSnapshots"
        url = uri("https://maven.zelythia.net/snapshots")
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    //    modCompileOnly "top.theillusivec4.curios:curios-forge:${rootProject.curios_version}:api"
    modCompileOnly "top.theillusivec4.curios:curios-neoforge:${rootProject.curios_version}"
    // Use the full Curios API jar at runtime
    modRuntimeOnly "top.theillusivec4.curios:curios-neoforge:${rootProject.curios_version}"

    modImplementation("net.zelythia:autotools-neoforge:${rootProject.autotools_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}