plugins {
    id 'com.gradleup.shadow'
}

repositories {
    maven {
        name = "zelythiaMaven"
        url = uri("https://maven.zelythia.net/releases")
    }
    maven {
        name = "zelythiaMavenSnapshots"
        url = uri("https://maven.zelythia.net/snapshots")
    }

    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')


    modImplementation("net.zelythia:autotools-fabric:${rootProject.autotools_version}")

    // Compile against only the API artifact
//    modCompileOnly "top.theillusivec4.curios:curios-forge:${rootProject.curios_version}:api"
    modCompileOnly "top.theillusivec4.curios:curios-fabric:${rootProject.curios_version_fabric}"
    // Use the full Curios API jar at runtime
    modRuntimeOnly "top.theillusivec4.curios:curios-fabric:${rootProject.curios_version_fabric}"

    // Required to run curios. Not properly included
    modRuntimeOnly("io.github.onyxstudios.Cardinal-Components-API:cardinal-components-base:${cardinal_components_version}" ){
        exclude group: "net.fabricmc", module: "fabric-loader"
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
